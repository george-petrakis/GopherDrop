<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="keywords" content="secure, secret sharing, file sharing, encryption, one-time link" />
    <meta name="author" content="GopherDrop Community" />

    <!-- Theme color for browser UI, kept in sync with the app's active
         (localStorage-driven) theme by App.vue, not the OS preference. -->
    <meta name="theme-color" content="#FBFAFE" />

    <!-- Favicon -->
    <link rel="icon" href="/src/assets/Images/favicon.ico" type="image/x-icon" />

    <!-- Open Graph Meta Tags for Social Media Sharing -->
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="/src/assets/Images/banner.png" />
    <meta property="og:type" content="website" />

    <title>__TITLE__</title>

    <!-- Preload critical assets -->
    <link rel="preload" href="/src/main.js" as="script" />
    <link rel="preload" href="/src/assets/Images/banner.png" as="image" />

    <!-- Main JavaScript -->
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <!-- NoScript Fallback -->
    <noscript>
      This application requires JavaScript to be enabled in your browser.
    </noscript>
  </body>
</html>
